<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d1230; --panel: #172050; --panel2: #1f2a6b; --edge: #3a4696; --text: #f4f6ff; --muted: #b4bdf2;
        --cyan: #22d3ee; --violet: #a78bfa; --pink: #f472b6; --amber: #fbbf24; --lime: #86efac; --coral: #fb7185; --ink: #1f2140;
        --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, system-ui, sans-serif; color: var(--text);
        background:
          radial-gradient(circle at 8% 6%, rgba(244, 114, 182, 0.30) 0, transparent 34%),
          radial-gradient(circle at 96% 96%, rgba(34, 211, 238, 0.26) 0, transparent 40%),
          radial-gradient(circle at 95% 22%, rgba(167, 139, 250, 0.28) 0, transparent 30%),
          radial-gradient(circle at 6% 70%, rgba(251, 191, 36, 0.14) 0, transparent 30%), var(--bg);
      }
      #root, #root * { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
      #brand { position: absolute; left: 60px; top: 64px; right: 60px; display: flex; align-items: center; justify-content: space-between; }
      .logo { font-size: 44px; font-weight: 900; letter-spacing: -0.03em; }
      .logo b { color: var(--pink); }
      .num { font-size: 26px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: var(--cyan); padding: 8px 22px; border-radius: 999px; }
      #qcard { position: absolute; left: 60px; top: 156px; width: 960px; background: var(--panel); border: 4px solid var(--violet); border-radius: 28px; padding: 22px 34px 26px; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3); }
      #qcard .qk { font-size: 24px; font-weight: 800; letter-spacing: 0.16em; color: var(--violet); text-transform: uppercase; }
      #qcard h1 { font-size: 56px; line-height: 1.12; font-weight: 900; letter-spacing: -0.02em; margin-top: 6px; }
      #qcard h1 code { font-family: var(--mono); color: var(--amber); font-weight: 800; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 10; }
      #stage > * { position: absolute; }

      .char { position: absolute; z-index: 40; }
      .char svg { display: block; width: 100%; height: auto; overflow: visible; }
      #sam { left: 40px; top: 1325px; width: 190px; }
      #byte { left: 850px; top: 1305px; width: 190px; }

      #captions { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
      .cline { position: absolute; left: 60px; top: 1590px; width: 960px; height: 190px; display: flex; align-items: center; justify-content: center; text-align: center;
        font-size: 44px; font-weight: 800; line-height: 1.22; background: #fff; border: 5px solid var(--violet); border-radius: 30px; padding: 10px 28px; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.35); color: var(--ink); }
      .cw { color: #6b7299; padding: 0 0.06em; border-radius: 8px; background-color: rgba(255, 201, 60, 0); }
      .cw.cwk { display: inline-block; font-family: var(--mono); font-weight: 800; color: #6a4df0; background-color: rgba(106, 77, 240, 0.14); padding: 0 0.22em; margin: 0 0.16em; }
      .cline .spk { position: absolute; left: 28px; top: -40px; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); padding: 3px 18px; border-radius: 999px; }
      .spk.byte { background: #34d399; } .spk.sam { background: #a78bfa; }

      .code { background: #0a0f2a; border: 4px solid var(--edge); border-radius: 22px; padding: 24px 30px; font-family: var(--mono); font-weight: 600; color: #e9ecff; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.32); white-space: pre; line-height: 1.4; }
      .code .cl { display: block; padding: 0 12px; margin: 0 -12px; border-radius: 8px; background-color: rgba(94, 234, 212, 0); }
      .code .cl i.rs { font-style: normal; float: right; font-weight: 800; padding: 0 16px; margin-top: 4px; line-height: 1.25; border-radius: 12px; color: var(--ink); }
      .rs.ok { background: var(--lime); } .rs.no { background: var(--coral); } .rs.cy { background: var(--cyan); }
      .tab { position: absolute; top: -22px; left: 24px; font: 800 22px Inter, Arial, sans-serif; color: var(--ink); background: var(--amber); border-radius: 999px; padding: 2px 18px; }
      .kw { color: #c4a7ff; } .st { color: #86efac; } .nu { color: #fdba74; } .cm { color: #93a0d6; font-style: italic; } .fn { color: #7dd3fc; } .tg { color: #f9a8d4; }
      .cons { background: #050818; color: #e9ecff; border: 4px solid var(--edge); border-radius: 22px; padding: 16px 30px 20px; font-family: var(--mono); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.32); }
      .cons .ct { font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-family: Inter, Arial, sans-serif; font-weight: 700; }
      .cons .out { display: block; line-height: 1.5; color: #86efac; white-space: pre; font-weight: 700; }
      .cons .out.no { color: #fda4af; } .cons .out.dim { color: var(--muted); } .cons .out.cy { color: #7dd3fc; } .cons .out.am { color: #fcd34d; }
      .bx { display: flex; flex-direction: column; justify-content: center; border-radius: 20px; border: 4px solid var(--edge); background: var(--panel); padding: 16px 24px; font-size: 44px; font-weight: 800; text-align: center; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3); line-height: 1.25; }
      .bx small { display: block; font-size: 32px; font-weight: 600; color: var(--muted); margin-top: 6px; font-family: Inter, Arial, sans-serif; }
      .bx.c1 { border-color: var(--cyan); } .bx.c2 { border-color: var(--violet); } .bx.c3 { border-color: var(--pink); } .bx.c4 { border-color: var(--amber); } .bx.c5 { border-color: var(--lime); } .bx.c6 { border-color: var(--coral); }
      .bx code, .note code { font-family: var(--mono); color: var(--amber); }
      .tn { font-family: var(--mono); font-weight: 800; font-size: 32px; color: var(--ink); border-radius: 14px; padding: 8px 20px; white-space: nowrap; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3); }
      .tn.a { background: var(--violet); } .tn.b { background: var(--cyan); } .tn.c { background: var(--amber); } .tn.d { background: var(--pink); } .tn.e { background: var(--lime); } .tn.f { background: var(--coral); }
      .note { font-size: 50px; font-weight: 700; line-height: 1.3; color: var(--text); text-align: center; }
      .note b { color: var(--amber); }
      .big { font-size: 110px; font-weight: 900; letter-spacing: -0.03em; text-align: center; }
      .pill { font-size: 32px; font-weight: 800; color: var(--ink); background: var(--amber); border-radius: 999px; padding: 6px 24px; white-space: nowrap; }
      .pill.cy { background: var(--cyan); } .pill.vi { background: var(--violet); } .pill.pk { background: var(--pink); } .pill.li { background: var(--lime); } .pill.co { background: var(--coral); }
      .arrow { font-size: 54px; font-weight: 900; color: var(--pink); line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{total}}" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voiceover.mp3" data-start="0" data-duration="{{total}}" data-volume="1"></audio>
      <audio id="bgm" src="assets/music.mp3" data-start="0" data-duration="{{total}}" data-volume="1" data-fade-in="1" data-fade-out="2"></audio>
      <div id="brand"><div class="logo">Interview<b>Bit</b></div><div class="num">{{tag}}</div></div>
      <div id="qcard"><div class="qk">Interview question</div><h1>{{question}}</h1></div>
      <div id="stage"></div>
      <div id="captions"></div>
      <div class="char" id="sam" data-kind="sam"></div>
      <div class="char" id="byte" data-kind="byte"></div>
    </div>
    <script>
      const T = /*__TIMING__*/ null;
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const KW = "function|const|let|var|return|async|await|new|if|else|throw|try|catch|finally|typeof|true|false|null|undefined|this|class|of|in|delete|void";
      const RE = new RegExp("(\\/\\/.*$)|(\"[^\"]*\"|'[^']*'|`[^`]*`)|\\b(" + KW + ")\\b|\\b(\\d+)\\b|\\b([A-Za-z_$][\\w$]*)(?=\\()", "g");
      function highlight(line) {
        return esc(line).replace(RE, (m, cm, st, kw, nu, fn) =>
          cm ? '<span class="cm">' + cm + "</span>" : st ? '<span class="st">' + st + "</span>" : kw ? '<span class="kw">' + kw + "</span>" : nu ? '<span class="nu">' + nu + "</span>" : '<span class="fn">' + fn + "</span>"
        );
      }
